[project]
name = "ai-customer-intelligence-platform"
version = "0.1.0.dev0"
description = "Plateforme Data Engineering, Machine Learning et Generative AI pour l'analyse et la prédiction du churn client."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ouardi Fatima Zohra" }]
# Les dépendances sont ajoutées carte par carte (uv add <paquet>), jamais par anticipation.
dependencies = []

[project.scripts]
cip = "cip.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip"]

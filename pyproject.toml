[project]
name = "ai-customer-intelligence-platform"
version = "0.1.0"
description = "Plateforme Data Engineering, Machine Learning et Generative AI pour l'analyse et la prédiction du churn client."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ouardi Fatima Zohra" }]
# Les dépendances sont ajoutées carte par carte (uv add <paquet>), jamais par anticipation.
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
    "typer>=0.29.1",
]

[project.scripts]
cip = "cip.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

# ------------------------------------------------------------------
# Qualité de code (DO-002)
# ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/W : style PEP 8 · F : erreurs (imports inutiles, noms indéfinis) · I : tri des imports
# B : bugs probables · UP : syntaxe Python moderne · S : sécurité (bandit) · SIM : simplifications
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Les assertions sont le mécanisme normal de pytest
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network and not integration'"
markers = [
    "integration: tests nécessitant des services externes (PostgreSQL...)",
    "network: tests accédant à Internet (exclus par défaut ; lancer avec -m network)",
]
